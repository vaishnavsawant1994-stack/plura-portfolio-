name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-api:
    name: Structural, semantic and contact API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source
        run: npm test
